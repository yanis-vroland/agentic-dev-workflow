name: CI du template

# Vérifications propres au template : ce workflow n'est pas copié par scripts/init.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  template:
    name: Vérifications du template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des scripts du template et de leurs tests (shellcheck)
        run: shellcheck scripts/*.sh tests/init-script.sh tests/lint-shell.sh

      - name: Validité de settings.json
        run: jq empty .claude/settings.json

      - name: Mémoire locale désactivée et hook de début de session branché (spec 004)
        run: |
          jq -e '.autoMemoryEnabled == false' .claude/settings.json
          jq -e '[.hooks.SessionStart[] | select(.matcher == "startup|resume|clear")
            | .hooks[].command | select(endswith("/.claude/hooks/session-start.sh"))] | length == 1' \
            .claude/settings.json

      - name: Frontmatter des skills et subagents
        run: |
          fail=0
          for f in .claude/agents/*.md .claude/skills/*/SKILL.md; do
            if ! head -1 "$f" | grep -qx -- '---' || ! grep -q '^name:' "$f" || ! grep -q '^description:' "$f"; then
              echo "Frontmatter invalide : $f"
              fail=1
            fi
          done
          exit $fail

      - name: Outils du subagent learning-curator, sans Bash (spec 005)
        run: |
          tools=$(sed -n 's/^tools: *//p' .claude/agents/learning-curator.md)
          if [ "$tools" != "Read, Grep, Glob, Write, Edit" ]; then
            echo "Outils inattendus pour learning-curator : « $tools »"
            exit 1
          fi

      - name: Hook restrict-learnings déclaré par learning-curator (spec 005, CA13)
        run: |
          # En-tête YAML seul : entre les deux premières lignes ---
          header=$(awk 'NR == 1 && $0 == "---" { inside = 1; next } inside && $0 == "---" { exit } inside' \
            .claude/agents/learning-curator.md)
          grep -qx 'hooks:' <<<"$header"
          grep -qx '  PreToolUse:' <<<"$header"
          grep -qx '    - matcher: "\*"' <<<"$header"
          grep -qx '          command: "\\"\$CLAUDE_PROJECT_DIR\\"/.claude/hooks/restrict-learnings.sh"' <<<"$header"
          test -x .claude/hooks/restrict-learnings.sh

      - name: Description de la PR lue par la revue IA (spec 005, CA14)
        run: |
          # Classes [$][{][{] : un dollar suivi de deux accolades serait évalué par GitHub Actions avant le shell
          grep -qE -- 'gh pr view [$][{][{] github[.]event[.]pull_request[.]number [}][}] --json title,body' \
            .github/workflows/ai-review.yml

      - name: Modèle de la revue IA lu dans reviewer.md, jamais en dur (spec 007, CA10)
        run: |
          f=.github/workflows/ai-review.yml
          grep -qF -- '.github/scripts/verifier-modeles.sh --afficher .claude/agents/reviewer.md' "$f"
          # Classes [$][{][{] : un dollar suivi de deux accolades serait évalué par GitHub Actions avant le shell
          grep -qE -- "claude_args: '--model [$][{][{] steps[.]modele[.]outputs[.]model [}][}] " "$f"
          if grep -nEi -- '(sonnet|opus|haiku|fable|claude-[a-z]+-[0-9])' "$f"; then
            echo "Nom de modèle en dur dans $f"
            exit 1
          fi

      # format.sh n'est plus branché à part : les hooks d'un même événement tournent
      # en parallèle, et lint.sh l'appelle avant le lint (CA6).
      - name: Hooks de lint et de tests branchés, formatage porté par lint.sh (spec 006, CA14)
        run: |
          jq -e '[.hooks.PostToolUse[] | select(.matcher == "Edit|Write|MultiEdit") | .hooks[]
            | select(.command | endswith("/.claude/hooks/lint.sh")) | select(.timeout == 60)]
            | length == 1' .claude/settings.json
          jq -e '[.hooks.Stop[] | .hooks[]
            | select(.command | endswith("/.claude/hooks/run-tests.sh")) | select(.timeout == 300)]
            | length == 1' .claude/settings.json
          jq -e '[.hooks.PostToolUse[] | .hooks[].command
            | select(endswith("/.claude/hooks/format.sh"))] | length == 0' .claude/settings.json
          test -x .claude/hooks/format.sh

      - name: Outils du subagent security-reviewer, lecture seule (spec 006, CA15)
        run: |
          f=.claude/agents/security-reviewer.md
          if [ ! -f "$f" ]; then
            echo "Subagent absent : $f"
            exit 1
          fi
          tools=$(sed -n 's/^tools: *//p' "$f")
          if [ "$tools" != "Read, Grep, Glob" ]; then
            echo "Outils inattendus pour security-reviewer : « $tools »"
            exit 1
          fi

      - name: Configuration des hooks de qualité du template (spec 006, CA23)
        run: |
          jq -e '.lint == "scripts/lint-shell.sh" and .test == "bash tests/hooks.sh"' \
            .claude/quality.json
          test -x scripts/lint-shell.sh

      - name: Test du lint shell du template (spec 006, CA23 et CA24)
        run: bash tests/lint-shell.sh

      - name: Test du script d'initialisation
        run: bash tests/init-script.sh
