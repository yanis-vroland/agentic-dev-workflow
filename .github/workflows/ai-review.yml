name: Revue IA

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    name: Revue IA de la PR
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO : ${{ github.repository }}
            PR : ${{ github.event.pull_request.number }}

            Fais la revue de cette PR en appliquant les consignes du fichier .claude/agents/reviewer.md.
            Utilise `gh pr diff` pour voir les changements.
            Rédige ton rapport en français dans le fichier ${{ runner.temp }}/revue-ia.md avec l'outil Write,
            puis publie-le en un seul commentaire :
            gh pr comment ${{ github.event.pull_request.number }} --body-file ${{ runner.temp }}/revue-ia.md
            N'utilise jamais --body : le hook protect-secrets refuse toute commande dont le texte
            cite un nom de fichier d'environnement, et le rapport ne serait pas publié.
          claude_args: '--allowed-tools "Read,Grep,Glob,Write,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
