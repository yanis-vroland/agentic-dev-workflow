name: Garde-fous

# Workflow générique, copié dans les projets par scripts/init.sh.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Version de gitleaks, alignée sur le poste local. Mise à jour manuelle :
# changer les deux valeurs ensemble (somme issue de gitleaks_<version>_checksums.txt).
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  garde-fous:
    name: Tests des garde-fous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des hooks et de leurs tests (shellcheck)
        run: shellcheck .claude/hooks/*.sh .githooks/pre-commit tests/hooks.sh tests/pre-commit.sh

      - name: Tests des hooks de Claude Code
        run: bash tests/hooks.sh

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Test du hook pre-commit
        run: bash tests/pre-commit.sh

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Analyse de tout l'historique
        run: gitleaks git --redact --verbose --no-banner .
