name: Garde-fous

# Workflow générique, copié dans les projets par scripts/init.sh du template agentic-dev-workflow.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Version de gitleaks, fixée. Renovate propose sa mise à jour (renovate.json) ;
# l'archive est vérifiée avec le fichier d'empreintes publié avec la release.
env:
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: 8.30.1

jobs:
  garde-fous:
    name: Tests des garde-fous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe des hooks, des scripts et de leurs tests (shellcheck)
        run: >-
          shellcheck .claude/hooks/*.sh .githooks/pre-commit .github/scripts/*.sh
          tests/hooks.sh tests/pre-commit.sh tests/verifier-revue-ia.sh
          tests/session-start.sh tests/verifier-journal.sh tests/quality-hooks.sh
          tests/verifier-modeles.sh tests/restrict-learnings.sh

      - name: Tests des hooks de Claude Code
        run: bash tests/hooks.sh

      - name: Test du hook restrict-learnings de learning-curator
        run: bash tests/restrict-learnings.sh

      - name: Test des hooks de lint et de tests
        run: bash tests/quality-hooks.sh

      - name: Test du hook de début de session
        run: bash tests/session-start.sh

      - name: Test du contrôle du journal
        run: bash tests/verifier-journal.sh

      - name: Test de la vérification de la revue IA
        run: bash tests/verifier-revue-ia.sh

      - name: Test de la vérification du modèle des subagents
        run: bash tests/verifier-modeles.sh

      - name: Modèle déclaré par chaque subagent (spec 007)
        run: .github/scripts/verifier-modeles.sh

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Exactement une ligne pour l'archive, sinon échec
          [ "$(grep -c "  ${archive}$" checksums.txt)" -eq 1 ]
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Test du hook pre-commit
        run: bash tests/pre-commit.sh

  journal:
    name: Journal
    # Un fichier de journal par branche, jamais modifié après son merge (spec 004)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Contrôle du journal de la PR
        run: >-
          .github/scripts/verifier-journal.sh
          "origin/${{ github.base_ref }}" HEAD

  secrets:
    name: Détection de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installation de gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          # Exactement une ligne pour l'archive, sinon échec
          [ "$(grep -c "  ${archive}$" checksums.txt)" -eq 1 ]
          grep "  ${archive}$" checksums.txt | sha256sum --check --strict
          sudo tar -xzf "${archive}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Analyse de tout l'historique
        run: gitleaks git --redact --verbose --no-banner .
